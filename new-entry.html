<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <nav>
      <div>
        <a href="index.html" class="logo">Digital Diary</a>
      </div>

      <button class="nav-toggle"><i class="fa-solid fa-bars"></i></button>

      <div class="main-links">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="new-entry.html" class="navLink active">Editor</a></li>
          <li><a href="vault.html">All Entries</a></li>
        </ul>
      </div>
      <div class="new-entries-profile">
        <a href="new-entry.html"
          ><button class="save-entry-1">New Entry</button></a
        >
        <a href="vault.html"><i class="fa-solid fa-circle-user"></i></a>
      </div>
    </nav>
    <div class="all-container">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="new-entry.html">Editor</a></li>
        <li><a href="vault.html">Entries</a></li>
      </ul>
      <button id="clear-btn">Clear All Entries</button>
    </div>
    <div class="form-grid">
      <div class="left-instructions">
        <p>
          DEPHT INSIGHT<br />
          Write without judgment.<br />
          The diary remembers only <br />
          what <strong>you</strong> choose to include.
        </p>
      </div>
      <form id="form">
        <div class="border-left">
          <input
            type="text"
            id="title"
            name="title"
            placeholder="Untitled Reflection"
            required
          />
        </div>

        <textarea
          name="textarea"
          id="textarea"
          placeholder="begin your reflection.."
          required
        ></textarea>
        <div class="form-btn">
          <div>
            <button type="button" class="btn-style">
              <i class="fa-solid fa-image"></i>Insert Memory
            </button>
            <button type="button" class="btn-style">
              <i class="fa-solid fa-unlock"></i>Private
            </button>
          </div>
          <div>
            <button type="button" id="discard" class="btn-style">
              Discard
            </button>
            <button type="submit" class="save">Save Entry</button>
          </div>
        </div>
      </form>
    </div>
    <footer>
      <p>&copy The digital diary. Designed for reflection.</p>
      <div class="footer-links">
        <a href="">Privacy</a>
        <a href="">Terms</a>
        <a href="">Archive</a>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
